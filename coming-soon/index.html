<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="쿠키프렌즈 길드 토벌전 기록 — 리뉴얼 중" />
  <title>쿠키프렌즈 | 리뉴얼 중</title>
  <style>
    :root {
      --bg: hsl(240, 10%, 3.9%);
      --fg: hsl(0, 0%, 98%);
      --muted: hsl(240, 5%, 64.9%);
      --subtle: hsl(240, 4%, 46%);
      --border: hsl(240, 3.7%, 15.9%);
      --card: hsl(240, 10%, 5.9%);
      --accent: hsl(45, 93%, 53%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--fg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard",
        "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(800px at 50% -10%, hsla(45, 93%, 53%, 0.04), transparent 60%),
        radial-gradient(600px at 80% 100%, hsla(217, 91%, 60%, 0.03), transparent 60%);
    }
    main {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.375rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: var(--card);
      margin-bottom: 2.5rem;
    }
    .brand-dot {
      width: 0.4375rem;
      height: 0.4375rem;
      border-radius: 9999px;
      background: var(--fg);
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .lede {
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.9375rem;
    }
    .lede + .lede { margin-top: 0.375rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 0.5rem 0.875rem;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 9999px;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .pulse {
      position: relative;
      width: 0.5rem;
      height: 0.5rem;
    }
    .pulse::before, .pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: var(--accent);
    }
    .pulse::after {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(2.2); opacity: 0; }
    }
    .meta {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--subtle);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      쿠키프렌즈
    </div>
    <h1>리뉴얼 중입니다</h1>
    <p class="lede">길드 토벌전 기록 시스템을 새로 만들고 있어요.</p>
    <p class="lede">더 나은 모습으로 곧 찾아뵙겠습니다.</p>
    <div class="status">
      <span class="pulse" aria-hidden="true"></span>
      Coming soon
    </div>
    <p class="meta">Cookie Run: Kingdom · Guild Raid Tracker</p>
  </main>
</body>
</html>
