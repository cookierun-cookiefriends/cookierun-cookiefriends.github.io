name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '배포 모드 선택'
        type: choice
        required: true
        default: coming-soon
        options:
          - coming-soon
          - app

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: inputs.mode == 'app'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: inputs.mode == 'app'
        run: npm ci

      - name: Build app
        if: inputs.mode == 'app'
        run: npm run build

      - name: Stage coming-soon page
        if: inputs.mode == 'coming-soon'
        run: |
          mkdir -p dist
          cp coming-soon/index.html dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
